[package]
name = "xix-svgconverter"
version = "0.1.0"
description = "XIX-SVGConverter - Winamp-themed batch SVG converter"
edition = "2021"

[lib]
name = "xix_svgconverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.2"
tauri-plugin-updater = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "rustls-tls-webpki-roots-no-provider", "stream", "json", "multipart", "socks"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
sha2 = "0.10"
x509-parser = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
parking_lot = "0.12"
regex = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0
